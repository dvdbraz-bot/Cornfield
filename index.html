<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Stay Away from the Cornfield</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #bbb;
    font: 18px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">Turn your phone sideways to play.</div>
<script src="lib/phaser.min.js"></script>
<script src="src/sfx.js"></script>
<script src="src/controls.js"></script>
<script src="src/save.js"></script>
<script src="src/map.js"></script>
<script src="src/FieldScene.js"></script>
<script src="src/Creature.js"></script>
<script src="src/NPC.js"></script>
<script src="src/StartScene.js"></script>
<script src="src/UIScene.js"></script>
<script src="src/PrologueScene.js"></script>
<script src="src/TestNightScene.js"></script>
<script src="src/chapters.js"></script>
<script src="src/ChapterScene.js"></script>
<script src="src/EndScene.js"></script>
<script src="src/main.js"></script>
</body>
</html>
